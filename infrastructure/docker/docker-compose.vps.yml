# ══════════════════════════════════════════════════════════════
# HumsYarX — Production VPS Orchestration (sw2.pwker.ir)
# Wave 7: Production Hardening, Resource Limits & Caddy Reverse Proxy
# Hardware Target: 2 Cores, 8GB RAM, 50GB SSD
# Total Container Memory Cap: 7.0 GB <= 7.0 GB (7168 MB) Limit
# ══════════════════════════════════════════════════════════════

name: humsyarx

services:
  # ── 1. Main Application: FastAPI + Telegram Bot + BotAPI ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_NAME: "medicalbot"
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/medicalbot?authSource=admin"
      PORT: "8000"
      TZ: "Asia/Tehran"
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 3072M
        reservations:
          cpus: "0.5"
          memory: 1024M
    networks:
      - humsyar

  # ── 2. MongoDB 7.0 Database Instance ──
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: medicalbot
    volumes:
      - mongodata:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2560M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - humsyar

  # ── 3. PyMuPDF Single-Concurrency Background Rendering Worker ──
  render_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-u", "-m", "backend.workers.render_worker"]
    env_file:
      - .env
    environment:
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/medicalbot?authSource=admin"
      CONCURRENCY: "1"
      TZ: "Asia/Tehran"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - humsyar

  # ── 4. Caddy Edge Proxy & Automated TLS Termination (HTTP/2 & HTTP/3) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-sw2.pwker.ir}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - humsyar

volumes:
  mongodata:
  caddydata:
  caddyconfig:

networks:
  humsyar:
