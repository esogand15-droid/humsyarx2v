# ════════════════════════════════════════════════════════════════════════════════
# 🏥 HumsYar Production Nginx Configuration
# Domains: humsyar.ir, www.humsyar.ir (and server IP / fallback domains)
# Features:
#   - Landing page on /
#   - Dedicated Student Web App on /student/ (with 301 redirect from /student)
#   - Telegram Mini App on /app/
#   - Web Admin Panel on /admin/
#   - FastAPI backend on /api/
#   - Cloudflare HTTPS + Origin SSL (ports 80, 8000, 8443, 2053)
# ════════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen 8000;
    listen 8443 ssl;
    listen 2053 ssl;
    server_name humsyar.ir www.humsyar.ir _;

    # SSL Certificates (Cloudflare Origin Cert or Let's Encrypt / acme.sh)
    ssl_certificate /etc/ssl/certs/humsyar_fullchain.cer;
    ssl_certificate_key /etc/ssl/private/humsyar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # 1. Ensure /student cleanly redirects to /student/ (prevents SPA routing mismatch)
    location = /student {
        return 301 /student/;
    }

    # 2. Proxy all requests to FastAPI Backend & Static Mounts (Uvicorn on port 8005)
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
