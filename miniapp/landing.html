<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)" />

    <title>هامزیار — دستیار دانشجوی پزشکی</title>
    <meta
      name="description"
      content="هامزیار: برنامهٔ هفتگی، بانک سؤال و آزمون، جزوه و منابع، دستیار هوشمند و پشتیبانی — برای دانشجویان پزشکی. با حساب تلگرام وارد شوید؛ نه رمز ثابت لازم است و نه اپ‌استور."
    />

    <!-- کارت اشتراک‌گذاری (og) — بدون اسکریپت سوم‌شخص -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="هامزیار — دستیار دانشجوی پزشکی" />
    <meta
      property="og:description"
      content="برنامهٔ هفتگی، بانک سؤال، جزوه و منابع، دستیار هوشمند. ورود سریع با تلگرام، روی هر دستگاهی."
    />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!--
      عمداً manifest و service worker روی لندینگ لود نمی‌شود تا
      نصب‌پذیری فقط روی نسخهٔ وب دانشجویی (/student/) فعال باشد.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('humsyar.theme');
          var sysLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme =
            saved === 'light' || saved === 'dark' ? saved : sysLight ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var bg = theme === 'light' ? '#F8FAFC' : '#090D16';
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="landing-root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif; line-height: 1.9" dir="rtl">
        <h1>هامزیار — دستیار دانشجوی پزشکی</h1>
        <p>
          برنامهٔ هفتگی، بانک سؤال و آزمون، جزوه و منابع، دستیار هوشمند و پشتیبانی.
          برای استفاده از نسخهٔ وب، جاوااسکریپت را فعال کنید.
        </p>
        <p><a href="/student/install">ورود به نسخهٔ وب هامزیار</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/landing/main-landing.jsx"></script>
  </body>
</html>
