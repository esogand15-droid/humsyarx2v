<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="هامزیار" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="هامزیار" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <title>هامزیار</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icons/icon-512.png" />
    <link rel="mask-icon" href="%BASE_URL%icons/maskable-512.png" color="#0B0F19" />
        <script>
          (function() {
            try {
              var saved = localStorage.getItem('humsyar.theme');
              var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
              var isDark = saved === 'dark' || !saved || (saved === 'system' && prefersDark);
              document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
              if (isDark) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
              /* the app theme can differ from the OS: point both theme-color metas at the page colour */
              var metas = document.querySelectorAll('meta[name="theme-color"]');
              for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', isDark ? '#0B0F19' : '#F8FAFC');
            } catch (e) {}
          })();
        </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
