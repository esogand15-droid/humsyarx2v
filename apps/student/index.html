<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="هامزیار" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="هامزیار" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <title>هامزیار</title>
    <meta name="description" content="هامزیار — جزوه‌ها، برنامهٔ مطالعه، آزمون و دستیار هوشیار برای دانشجویان پزشکی، روی گوشی، تبلت و دسکتاپ." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icons/icon-512.png" />
    <link rel="mask-icon" href="%BASE_URL%icons/maskable-512.png" color="#0B0F19" />
        <script>
          (function() {
            try {
              var saved = localStorage.getItem('humsyar.theme');
              var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
              var isDark = saved === 'dark' || !saved || (saved === 'system' && prefersDark);
              document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
              if (isDark) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
              /* the app theme can differ from the OS: point both theme-color metas at the page colour */
              var metas = document.querySelectorAll('meta[name="theme-color"]');
              for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', isDark ? '#0B0F19' : '#F3F5F8');
            } catch (e) {}
          })();
        </script>
    <style>
      /* Boot splash: painted before any JS/CSS chunk loads; createRoot() replaces it on first render. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #F3F5F8; color: #334155;
        font: 600 14px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
      html.dark .boot { background: #0B0F19; color: #CBD5E1; }
      .boot__glow { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(40rem 28rem at 50% 42%, rgba(37, 99, 235, 0.16), transparent 70%); }
      .boot__col { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px;
        opacity: 0; animation: boot-in 360ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms forwards; }
      .boot__mark { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
      .boot__mark img { width: 64px; height: 64px; border-radius: 16px; animation: boot-pulse 2.4s ease-in-out infinite; }
      .boot__ring { position: absolute; inset: 0; animation: boot-spin 1.4s linear infinite; }
      .boot__ring circle { fill: none; }
      .boot__track { stroke: rgba(148, 163, 184, 0.26); stroke-width: 3; }
      .boot__arc { stroke: #2563EB; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 90 327;
        animation: boot-dash 1.4s ease-in-out infinite; }
      .boot__word { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: #0F172A; }
      html.dark .boot__word { color: #F3F5F8; }
      .boot__word b { color: #2563EB; font-weight: inherit; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 50% { transform: scale(0.94); } }
      @keyframes boot-dash {
        0% { stroke-dasharray: 20 327; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 150 327; stroke-dashoffset: -40; }
        100% { stroke-dasharray: 20 327; stroke-dashoffset: -307; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__col { animation: none; opacity: 1; }
        .boot__mark img, .boot__arc { animation: none; }
        .boot__ring { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-label="در حال بارگذاری هامزیار">
        <div class="boot__glow" aria-hidden="true"></div>
        <div class="boot__col">
          <div class="boot__mark" aria-hidden="true">
            <svg class="boot__ring" viewBox="0 0 120 120">
              <circle class="boot__track" cx="60" cy="60" r="52" />
              <circle class="boot__arc" cx="60" cy="60" r="52" />
            </svg>
            <img src="%BASE_URL%brand-app-icon.webp" alt="" width="64" height="64" decoding="async" fetchpriority="high" />
          </div>
          <div class="boot__word">هامز<b>یار</b></div>
          <div>در حال آماده‌سازی…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
