<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="هامزیار" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="هامزیار" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0B0F19" />
    <title>هامزیار</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icons/icon-512.png" />
    <link rel="mask-icon" href="%BASE_URL%icons/maskable-512.png" color="#0B0F19" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('humsyar.theme');
          var isDark = saved === 'dark' || (!saved || saved === 'system');
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
